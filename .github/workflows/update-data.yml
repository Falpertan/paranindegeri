# Her ayın 5'inde TCMB verisini çeker, data/paranindegeri-data.json günceller.
# Cloudflare Pages repo'ya bağlıysa deploy otomatik tetiklenir.

name: Paranın Değeri veri güncelleme

on:
  schedule:
    - cron: '0 6 5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: TCMB EVDS çek
        env:
          TCMB_API_KEY: ${{ secrets.TCMB_API_KEY }}
        run: node tools/fetch-evds.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paranindegeri-data.json
          git diff --staged --quiet || git commit -m "chore: TCMB EVDS veri güncellemesi"
          git push
